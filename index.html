<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Vortex</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">

<meta name="theme-color" content="#070812">
</head>

<body>

<div class="bg"></div>

<!-- MENU / UPLOAD SCREEN -->
<div id="menu" class="menu">

  <div class="header">
    <h1>Vortex</h1>
    <p>Load a GBA ROM to begin</p>
  </div>

  <div class="card">
    <input id="romInput" type="file" accept=".gba,.gb,.gbc" hidden>

    <button class="btn" onclick="document.getElementById('romInput').click()">
      Select ROM
    </button>

    <div id="fileName" class="filename">No ROM selected</div>
  </div>

</div>

<!-- FULLSCREEN EMULATOR -->
<div id="emulatorScreen" class="emulator-screen hidden">
  <div id="game"></div>
</div>

<script src="app.js"></script>

</body>
</html>
