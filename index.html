<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
body {
    margin: 0;
    font-family: sans-serif;
}

#bar {
    display: flex;
    padding: 10px;
    background: #222;
}

input {
    flex: 1;
    padding: 10px;
}

button {
    padding: 10px;
}

iframe {
    width: 100%;
    height: calc(100vh - 60px);
    border: none;
}
</style>
</head>

<body>

<div id="bar">
    <input id="url" value="https://youtube.com">
    <button onclick="go()">Go</button>
</div>

<iframe id="frame"></iframe>

<script>
function go() {
    let url = document.getElementById("url").value;

    if (!url.startsWith("http")) {
        url = "https://" + url;
    }

    document.getElementById("frame").src = url;
}

go();
</script>

</body>
</html>
