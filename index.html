<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Vortex</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

<!-- SYSTEM MENU -->
<div id="menu" class="menu">
  <div class="glass">
    <div class="logo">Vortex</div>
    <div class="sub">Choose System</div>

    <div class="grid">
      <button onclick="selectSystem('gba')">Game Boy Advance</button>
      <button onclick="selectSystem('n64')">Nintendo 64</button>
      <button onclick="selectSystem('3ds')">Nintendo 3DS</button>
    </div>

    <input id="romInput" type="file" />
  </div>
</div>

<!-- EMULATOR -->
<div id="emulatorScreen" class="emulator hidden">
  <div id="game"></div>
</div>

<script src="app.js"></script>
</body>
</html>
