<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Neo Retro</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">

<meta name="theme-color" content="#0b0f1a">
</head>

<body>

<div class="bg"></div>

<div class="container">

  <div class="glass header">
    <h1>Neo Retro</h1>
    <p>Upload a ROM and play instantly</p>
  </div>

  <div class="glass upload-box">
    <input type="file" id="romInput" accept=".gba,.gb,.gbc" hidden>
    
    <button class="btn glow" onclick="document.getElementById('romInput').click()">
      📂 Choose ROM
    </button>

    <p id="fileName">No file selected</p>
  </div>

  <div id="emulator" class="emulator glass hidden"></div>

</div>

<script src="app.js"></script>
<script src="https://cdn.emulatorjs.org/latest/data/loader.js"></script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
