<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Vortex</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

<!-- HOME -->
<div id="home" class="view active">
  <div class="glass">
    <div class="logo">Vortex</div>
    <div class="sub">Select System</div>

    <div class="menu">
      <button onclick="select('gba')">Game Boy Advance</button>
      <button onclick="select('n64')">Nintendo 64</button>
      <button onclick="select('3ds')">Nintendo 3DS</button>
    </div>
  </div>
</div>

<!-- ROM -->
<div id="rom" class="view">
  <div class="glass">
    <div class="title" id="title">Load ROM</div>

    <input type="file" id="file" />

    <button class="primary" onclick="launch()">Start</button>
    <button onclick="back()">Back</button>
  </div>
</div>

<!-- EMULATOR -->
<div id="emu" class="view emu">
  <div id="game"></div>
</div>

<script src="app.js"></script>
</body>
</html>
