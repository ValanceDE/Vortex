<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Nova Emulator</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">

<meta name="theme-color" content="#0a0a12">
</head>

<body>

<div class="bg"></div>

<div class="app">

  <!-- HEADER -->
  <div class="top">
    <h1>Nova</h1>
    <p>GBA Emulator • Upload & Play instantly</p>
  </div>

  <!-- UPLOAD CARD -->
  <div class="card">
    <input id="romInput" type="file" accept=".gba,.gb,.gbc" hidden>

    <button class="btn" onclick="document.getElementById('romInput').click()">
      Upload ROM
    </button>

    <div id="fileName" class="filename">No file selected</div>
  </div>

  <!-- EMULATOR -->
  <div id="emuWrapper" class="emu hidden">
    <div id="game"></div>
  </div>

</div>

<script src="app.js"></script>

</body>
</html>
