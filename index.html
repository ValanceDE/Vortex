<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Retro Arcade</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">

    <header>
      <h1>Retro Arcade</h1>
      <p>Play GBA games instantly</p>
    </header>

    <main>

      <div class="grid">
        <button class="card" onclick="loadGame('game.gba')">
          <h3>Game 1</h3>
          <p>Click to play</p>
        </button>

        <button class="card" onclick="loadGame('game2.gba')">
          <h3>Game 2</h3>
          <p>Click to play</p>
        </button>
      </div>

      <div id="emulator" class="emulator hidden"></div>

    </main>

  </div>

  <!-- EmulatorJS -->
  <script src="https://cdn.emulatorjs.org/latest/data/loader.js"></script>
  <script src="app.js"></script>

</body>
</html>
