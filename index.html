<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060a">

<title>Vortex</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- BACKGROUND -->
<div id="background">
  <div class="gradient one"></div>
  <div class="gradient two"></div>
  <div class="gradient three"></div>
</div>

<!-- HOME -->
<div id="home">
  <div class="glass">

    <h1 class="logo">Vortex</h1>
    <p class="sub">Select system</p>

    <button class="card" data-core="gba">Game Boy Advance</button>
    <button class="card" data-core="n64">Nintendo 64</button>
    <button class="card" data-core="3ds">Nintendo 3DS</button>

  </div>
</div>

<!-- FILE INPUT -->
<input id="romInput" type="file" hidden>

<!-- LOADING -->
<div id="loading">
  <div class="loader">Loading...</div>
</div>

<!-- EMULATOR -->
<div id="emulator">
  <div id="game"></div>
</div>

<script src="app.js"></script>

</body>
</html>
