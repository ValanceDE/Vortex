<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Vortex Emulator</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- HOME / SELECTION UI -->
  <div id="home" class="screen active">
    <div class="glass-card">
      <h1 class="title">Vortex</h1>
      <p class="subtitle">Select a system</p>

      <div class="grid">
        <button class="btn" onclick="selectSystem('gba')">GBA</button>
        <button class="btn" onclick="selectSystem('n64')">N64</button>
        <button class="btn" onclick="selectSystem('3ds')">3DS</button>
      </div>
    </div>
  </div>

  <!-- ROM SELECT UI -->
  <div id="rom" class="screen">
    <div class="glass-card">
      <h2 id="systemTitle">System</h2>

      <input id="fileInput" type="file" class="file" />

      <button class="btn primary" onclick="startGame()">Start Game</button>
      <button class="btn ghost" onclick="backHome()">Back</button>
    </div>
  </div>

  <!-- EMULATOR VIEW -->
  <div id="emulator" class="screen emulator">
    <div id="game"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
