<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SpaceLauncher</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0a0a0f" />

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app">

    <header>
      <h1>SpaceLauncher</h1>
      <p>iOS Web Launcher</p>
    </header>

    <section class="card">
      <h2>Launcher</h2>

      <input id="urlInput" placeholder="settings://, shortcuts://..." />
      <button onclick="openURL()">Öffnen</button>
    </section>

    <section class="card">
      <h2>Shortcuts</h2>

      <input id="shortcutName" placeholder="Shortcut Name" />
      <input id="shortcutText" placeholder="Text/Input" />

      <button onclick="runShortcut()">Run Shortcut</button>
    </section>

    <section class="card">
      <h2>Notifications</h2>

      <button onclick="enableNotifications()">Aktivieren</button>
      <button onclick="sendTestNotification()">Test senden</button>
    </section>

  </div>

  <script src="app.js"></script>
</body>
</html>
