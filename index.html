<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,
initial-scale=1,
viewport-fit=cover,
maximum-scale=1">

<title>Vortex</title>

<meta name="theme-color" content="#09090B">

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="background">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="noise"></div>
</div>

<main id="menu">

<header>

<div class="logo">

<div class="logoGlow"></div>

<h1>Vortex</h1>

<p>
Modern Nintendo Emulator
</p>

</div>

</header>

<section id="systems">

<button
class="system"
data-core="gba">

<div class="icon">🎮</div>

<div class="text">

<h2>Game Boy Advance</h2>

<p>
mGBA Emulator
</p>

</div>

<div class="arrow">

<svg
viewBox="0 0 24 24">

<path
d="M9 6l6 6-6 6"/>

</svg>

</div>

</button>

<button
class="system"
data-core="n64">

<div class="icon">🕹️</div>

<div class="text">

<h2>Nintendo 64</h2>

<p>
Mupen64Plus
</p>

</div>

<div class="arrow">

<svg
viewBox="0 0 24 24">

<path
d="M9 6l6 6-6 6"/>

</svg>

</div>

</button>

<button
class="system"
data-core="3ds">

<div class="icon">📱</div>

<div class="text">

<h2>Nintendo 3DS</h2>

<p>
Azahar Emulator
</p>

</div>

<div class="arrow">

<svg
viewBox="0 0 24 24">

<path
d="M9 6l6 6-6 6"/>

</svg>

</div>

</button>

</section>

<footer>

Built with EmulatorJS

</footer>

</main>

<div
id="emulatorScreen"
class="hidden">

<div id="game"></div>

</div>

<input
id="romInput"
type="file"
hidden>

<script src="app.js"></script>

</body>
</html>
